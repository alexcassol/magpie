name: Examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "lib/**"
      - "mix.exs"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - "lib/**"
      - "mix.exs"
      - ".github/workflows/examples.yml"

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [order_inbox, verified_backup, document_search]
    defaults:
      run:
        working-directory: examples/${{ matrix.project }}
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix run demo.exs
